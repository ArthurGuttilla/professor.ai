# Publica o site estático (site/) no GitHub Pages.
#
# O passo configure-pages usa "enablement: true" para habilitar o Pages
# automaticamente (Source: GitHub Actions) — sem configuração manual.
# O site é HTML/CSS/JS puro — não há etapa de build.
#
# Nota: o Pages serve APENAS este site estático (landing + demo).
# A plataforma completa (app Next.js em src/) precisa de servidor
# Node + PostgreSQL — ver README.

name: Deploy site to GitHub Pages

on:
  push:
    branches: [main, claude/university-teaching-platform-do4qwn]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
